<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DisCal Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 28px 20px 48px;
    }
    h1 { font-size: 26px; color: #a8ff78; margin-bottom: 32px; font-weight: 700; }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #2a2a3e;
      color: #fff;
      font-size: 16px;
      margin-bottom: 24px;
      outline: none;
    }
    input:focus { border-color: #a8ff78; }
    .save-btn {
      width: 100%;
      padding: 16px;
      border-radius: 8px;
      border: none;
      background: #a8ff78;
      color: #1a1a2e;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .save-btn:active { background: #8fdf60; }
  </style>
</head>
<body>
  <h1>DisCal</h1>

  <label>Daily calorie limit</label>
  <input type="number" id="limit" inputmode="numeric" placeholder="e.g. 2000">

  <label>Discord webhook URL</label>
  <input type="url" id="webhook" inputmode="url" placeholder="https://discord.com/api/webhooks/...">

  <button class="save-btn" onclick="save()">Save &amp; Close</button>

  <script>
    function getOpts() {
      try {
        var hash = location.hash.slice(1);
        return hash ? JSON.parse(decodeURIComponent(hash)) : {};
      } catch(e) { return {}; }
    }

    var opts = getOpts();
    document.getElementById('limit').value   = opts.dailyLimit || 2000;
    document.getElementById('webhook').value = opts.webhookUrl || '';

    function save() {
      var cfg = {
        dailyLimit: parseInt(document.getElementById('limit').value, 10) || 2000,
        webhookUrl: document.getElementById('webhook').value.trim()
      };
      location.href = 'pebblejs://close#' + encodeURIComponent(JSON.stringify(cfg));
    }
  </script>
</body>
</html>
